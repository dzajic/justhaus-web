<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Just Haus</title>
  <meta name="description" content="Just Haus — high-performance, thoughtfully built homes in Franconia, NH." />
  <style>
    :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f6f6f6; }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--fg); background:var(--bg);
    }
    .wrap{ max-width:920px; margin:0 auto; padding:56px 20px; }
    header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    h1{ margin:0; font-size:36px; letter-spacing:-0.02em; }
    .tag{ color:var(--muted); font-size:14px; }
    .hero{ margin-top:28px; padding:22px; background:var(--card); border-radius:18px; }
    .hero p{ margin:0; font-size:18px; line-height:1.5; }
    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px; }
    .card{ padding:18px; border-radius:16px; background:#fff; border:1px solid #e9e9e9; }
    .card h2{ margin:0 0 8px; font-size:16px; }
    .card p{ margin:0; color:var(--muted); line-height:1.45; font-size:14px; }
    a{ color:inherit; text-underline-offset:3px; }
    footer{ margin-top:36px; display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
    .btn{
      display:inline-block; padding:10px 12px; border-radius:12px;
      border:1px solid #e2e2e2; background:#fff; text-decoration:none;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Just Haus</h1>
      <div class="tag">Franconia, New Hampshire</div>
    </header>

<section class="hero">
  <p>
    Independent, inspired, thoughtful.
  </p>
  <h3>Goals</h3>
  <ul style="margin-top:10px; padding-left:18px; line-height:1.6;">
    <li>Simple</li>
    <li>Comfortable</li>
    <li>Efficient</li>
    <li>Maintainable</li>
    <li>Sustainable</li>
  </ul>

  <p style="margin-top:16px;">
    A never-ending experiment to enjoy hard work, learn and inspire others to do the same.
  </p>

  <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
    <a class="btn" href="https://photos.app.goo.gl/9Ff6oVJRnxn4yU3u5">Project updates</a>
  </div>
</section>

    <footer>
      <span>© <span id="y"></span> Just Haus</span>
      <span>•</span>
      <a href="mailto:hello@justha.us">justhaus.us@gmail.com</a>
    </footer>
  </main>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
